<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LexisGraph · 交互原型</title>
    <style>
        :root {
            font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
            color: #18243b;
            background: #f4f7fb;
            font-size: 14px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .app {
            display: grid;
            grid-template-columns: 236px minmax(0, 1fr);
            min-height: 100vh
        }

        .side {
            background: #17243a;
            color: #b8c6d9;
            padding: 24px 14px;
            display: flex;
            flex-direction: column;
            gap: 22px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: white;
            font-weight: 800;
            font-size: 18px;
            padding: 0 10px
        }

        .mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #5a78f6, #31b5e9);
            box-shadow: 0 6px 18px #426fff66
        }

        .side small {
            padding: 0 14px;
            color: #8092ae;
            font-size: 11px;
            letter-spacing: .13em
        }

        .nav {
            display: grid;
            gap: 3px
        }

        .nav button {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: center;
            background: none;
            color: #b8c6d9;
            border: 0;
            border-radius: 10px;
            text-align: left;
            padding: 11px 13px
        }

        .nav button:hover,
        .nav button.active {
            background: #ffffff18;
            color: white
        }

        .nav button.active {
            box-shadow: inset 3px 0 #71a7ff
        }

        .nav i {
            width: 18px;
            font-size: 16px;
            font-style: normal;
            text-align: center
        }

        .side-foot {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid #ffffff1c;
            color: #8fa0b8;
            font-size: 12px
        }

        .main {
            min-width: 0
        }

        .top {
            height: 68px;
            background: #fff;
            border-bottom: 1px solid #e4eaf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 18px
        }

        .crumb {
            font-size: 13px;
            color: #75839b
        }

        .crumb strong {
            color: #18243b
        }

        .top-right {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .badge {
            border-radius: 100px;
            padding: 5px 9px;
            background: #edf3ff;
            color: #3564bd;
            font-size: 12px;
            white-space: nowrap
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e3ebf9;
            display: grid;
            place-items: center
        }

        .content {
            padding: 29px 32px;
            max-width: 1580px;
            margin: auto
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 22px
        }

        .head h1 {
            font-size: 26px;
            letter-spacing: -.04em;
            margin: 0 0 7px
        }

        .muted {
            color: #697990
        }

        .head p,
        .card p {
            margin: 0;
            color: #697990;
            line-height: 1.6
        }

        .actions,
        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid #dce4ef;
            background: #fff;
            color: #273b58;
            border-radius: 9px;
            padding: 9px 13px;
            min-height: 37px;
            transition: .18s
        }

        .btn:hover {
            border-color: #a9c0e9;
            background: #f8fbff;
            transform: translateY(-1px)
        }

        .primary {
            background: #315fd3;
            color: #fff;
            border-color: #315fd3;
            box-shadow: 0 5px 14px #315fd330
        }

        .primary:hover {
            background: #254eb9;
            color: #fff
        }

        .subtle {
            background: #f1f5fa
        }

        .danger {
            color: #ba4652
        }

        .grid {
            display: grid;
            gap: 18px
        }

        .two {
            grid-template-columns: minmax(0, 1.1fr) minmax(330px, .9fr)
        }

        .three {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .card {
            background: #fff;
            border: 1px solid #e1e7f0;
            border-radius: 15px;
            box-shadow: 0 5px 24px #273b5608;
            padding: 20px
        }

        .card h2 {
            font-size: 16px;
            margin: 0 0 15px
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 10px
        }

        .stat strong {
            font-size: 30px;
            display: block;
            letter-spacing: -.05em;
            margin: 7px 0
        }

        .stat span {
            color: #6f7d92
        }

        .section {
            margin-top: 19px
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px
        }

        .section-title h2 {
            margin: 0;
            font-size: 18px
        }

        .choice {
            display: flex;
            gap: 6px;
            background: #f0f3f8;
            padding: 4px;
            border-radius: 10px;
            flex-wrap: wrap
        }

        .choice button {
            border: 0;
            background: transparent;
            border-radius: 7px;
            padding: 8px 12px;
            color: #60708a
        }

        .choice button.active {
            background: #fff;
            color: #244fba;
            box-shadow: 0 2px 6px #243c5d16
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 13px;
            font-size: 12px;
            font-weight: 650;
            color: #465671
        }

        .field input,
        .field select,
        .field textarea,
        .search {
            width: 100%;
            border: 1px solid #dce4ee;
            border-radius: 9px;
            padding: 10px 11px;
            background: #fff;
            color: #1d2b44;
            outline: none
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus,
        .search:focus {
            border-color: #6d98ec;
            box-shadow: 0 0 0 3px #dfeaff
        }

        .field textarea {
            resize: vertical;
            min-height: 80px
        }

        .form-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .drop {
            border: 1.5px dashed #b9c9df;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            background: #f9fbff;
            cursor: pointer;
            transition: .18s
        }

        .drop:hover,
        .drop.drag {
            border-color: #5c86dc;
            background: #edf4ff
        }

        .drop b {
            display: block;
            margin: 7px
        }

        .drop input {
            display: none
        }

        .hint {
            font-size: 12px;
            color: #77869c
        }

        .notice {
            border-radius: 10px;
            background: #f0f5ff;
            color: #4b6389;
            padding: 11px 13px;
            font-size: 12px;
            line-height: 1.5
        }

        .list {
            display: grid;
            gap: 8px
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border: 1px solid #e5eaf2;
            border-radius: 10px;
            background: white;
            text-align: left;
            width: 100%;
            color: inherit
        }

        .list-item:hover,
        .list-item.selected {
            border-color: #9db8ed;
            background: #f5f8ff
        }

        .pill {
            border-radius: 100px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 650;
            white-space: nowrap;
            background: #edf3fb;
            color: #58708f
        }

        .pill.high {
            background: #fff0f0;
            color: #be4d57
        }

        .pill.medium {
            background: #fff5df;
            color: #a56b15
        }

        .pill.good {
            background: #eaf8f0;
            color: #28835b
        }

        .pill.wait {
            background: #eef1f6;
            color: #62728a
        }

        .table-wrap {
            overflow: auto
        }

        .table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap
        }

        .table th,
        .table td {
            text-align: left;
            padding: 13px 11px;
            border-bottom: 1px solid #edf0f5
        }

        .table th {
            font-size: 12px;
            color: #6b7d94;
            background: #f8fafd
        }

        .table tr:last-child td {
            border-bottom: 0
        }

        .table button {
            padding: 6px 9px;
            min-height: 29px
        }

        .workbench {
            display: grid;
            grid-template-columns: minmax(240px, 23%) minmax(360px, 1fr) minmax(290px, 28%);
            gap: 14px;
            align-items: start
        }

        .workbench .card {
            min-height: 610px
        }

        .issue {
            cursor: pointer
        }

        .issue strong {
            font-size: 13px
        }

        .issue small {
            display: block;
            color: #74839a;
            margin-top: 5px
        }

        .paper {
            background: #fff;
            box-shadow: 0 10px 34px #1b2a4314;
            border: 1px solid #e8edf4;
            border-radius: 9px;
            margin: 14px auto;
            padding: 35px 38px;
            max-width: 660px;
            min-height: 470px;
            line-height: 1.85
        }

        .paper h2 {
            text-align: center;
            font-size: 19px
        }

        .clause {
            padding: 8px;
            border-radius: 7px;
            margin: 8px -8px;
            cursor: pointer
        }

        .clause:hover,
        .clause.selected {
            background: #fff7e8
        }

        .clause.selected {
            box-shadow: inset 3px 0 #e9a84b
        }

        .diff-old,
        .diff-new {
            padding: 13px;
            border-radius: 8px;
            line-height: 1.6;
            margin: 8px 0;
            white-space: pre-wrap
        }

        .diff-old {
            background: #fff0ef;
            color: #8f4042;
            border-left: 3px solid #dc7772
        }

        .diff-new {
            background: #eaf8f1;
            color: #286b4a;
            border-left: 3px solid #60b78b
        }

        .tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #e4eaf2;
            margin-bottom: 14px
        }

        .tabs button {
            background: none;
            border: 0;
            padding: 10px 13px;
            color: #708096;
            border-bottom: 2px solid transparent
        }

        .tabs button.active {
            color: #315fd3;
            border-bottom-color: #315fd3
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f5
        }

        .doc-edit {
            width: 100%;
            min-height: 360px;
            border: 0;
            outline: 0;
            line-height: 1.8;
            resize: vertical;
            color: #1d2b44
        }

        .empty {
            padding: 45px;
            text-align: center;
            color: #74839a
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1c304e;
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 10px 30px #1b2b4d4d;
            z-index: 30
        }

        .modal-back {
            position: fixed;
            inset: 0;
            background: #14213c7a;
            display: grid;
            place-items: center;
            padding: 20px;
            z-index: 20
        }

        .modal {
            background: white;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 22px 80px #10203b55
        }

        .modal h2 {
            margin: 0 0 15px
        }

        .hide {
            display: none !important
        }

        @media(max-width:1100px) {
            .workbench {
                grid-template-columns: 260px minmax(0, 1fr)
            }

            .workbench>:last-child {
                grid-column: 1/-1;
                min-height: 0
            }
        }

        @media(max-width:760px) {
            .app {
                grid-template-columns: 1fr
            }

            .side {
                position: static;
                padding: 12px;
                gap: 9px
            }

            .side small,
            .side-foot {
                display: none
            }

            .nav {
                display: flex;
                overflow: auto
            }

            .nav button {
                white-space: nowrap
            }

            .top {
                padding: 0 15px
            }

            .content {
                padding: 19px 13px
            }

            .two,
            .three,
            .workbench {
                grid-template-columns: 1fr
            }

            .workbench>:last-child {
                grid-column: auto
            }

            .form-two {
                grid-template-columns: 1fr
            }

            .head {
                display: block
            }

            .head .actions {
                margin-top: 13px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand"><span class="mark">◇</span> LexisGraph</div><small>工作空间</small>
            <nav id="nav" class="nav"></nav>
            <div class="side-foot">交互原型 · 示例数据<br>所有操作仅在本页演示</div>
        </aside>
        <div class="main">
            <header class="top">
                <div class="crumb">合同工作 <span style="margin:0 7px">/</span> <strong id="crumb"></strong></div>
                <div class="top-right"><span class="badge">本地演示</span><button class="btn"
                        onclick="openModal('model')">模型配置</button><span class="avatar">法</span></div>
            </header>
            <main id="view" class="content"></main>
        </div>
    </div>
    <div id="toast" class="toast hide" role="status"></div>
    <div id="modal" class="modal-back hide" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal-body"></div>
    </div>
    <script>
        const menus = [['start', '新建审查', '⌂'], ['records', '审查记录', '▤'], ['validations', '模板核验记录', '☑'], ['drafts', '合同起草', '✎'], ['templates', '合同模板', '▧'], ['checklists', '审查清单', '☷'], ['categories', '业务分类', '▦']];
        const sample = `云服务采购协议\n\n甲方：星河科技有限公司\n乙方：远山云计算有限公司\n\n第一条 服务内容\n乙方向甲方提供云计算资源、系统维护及技术支持。\n\n第二条 服务期限\n本协议自双方签署之日起生效，服务期限为十二个月。\n\n第三条 付款安排\n甲方应在收到乙方合格发票后五个工作日内支付全部服务费用。\n\n第四条 责任限制\n乙方对因服务中断造成的损失不承担任何责任。\n\n第五条 数据与保密\n双方应对履约中获悉的商业秘密承担保密义务。`;
        let state = { page: 'start', flow: 'choose', stance: '中立审慎', scale: '标准', source: '', file: '', category: '', focus: '', background: '', selectedIssue: 0, tab: 'opinions', mode: 'marked', reviewStatus: '待处理', issues: [{ title: '付款期限较短', level: 'medium', levelName: '中风险', clause: '第三条 付款安排', old: '甲方应在收到乙方合格发票后五个工作日内支付全部服务费用。', next: '甲方应在收到乙方合格发票并完成验收后十五个工作日内支付相应费用。', reason: '建议将付款与验收节点关联，明确可执行的付款条件。', status: '待处理' }, { title: '免责范围过宽', level: 'high', levelName: '高风险', clause: '第四条 责任限制', old: '乙方对因服务中断造成的损失不承担任何责任。', next: '乙方因故意或重大过失造成服务中断的，应承担相应赔偿责任；其他责任以本合同已支付服务费为限。', reason: '全面免责可能使损失分配失衡，应保留故意及重大过失责任。', status: '待处理' }, { title: '保密期限未明确', level: 'medium', levelName: '中风险', clause: '第五条 数据与保密', old: '双方应对履约中获悉的商业秘密承担保密义务。', next: '双方应对履约中获悉的商业秘密承担保密义务；商业秘密在其仍构成商业秘密期间持续受保护。', reason: '补足保密义务的存续安排，减少终止后的解释争议。', status: '待处理' }], draftTitle: '云服务采购协议', draftText: '', draftReq: '', draftType: '服务采购合同', draftPerspective: '中立审慎', draftPartyA: '星河科技有限公司', draftPartyB: '远山云计算有限公司', draftSaved: false, recordFilter: '', templateFilter: '', checkFilter: '', categoryFilter: '', selectedTemplate: '云服务采购标准模板', validationFile: '', validationResult: false };
        const records = [['云服务采购协议', '风险审查', '复核中', '2026-10-22'], ['技术保密协议', '风险审查', '已完成', '2026-10-20'], ['办公设备采购合同', '模板核验', '需人工确认', '2026-10-18']];
        const templates = [['云服务采购标准模板', 'DOCX', '已发布 · v3', '采购合同'], ['技术保密协议模板', 'DOCX', '规则草稿', '保密协议'], ['设备交付确认书', 'PDF', '仅原件预览', '采购合同']];
        const checklists = [['采购合同审查清单', '采购合同', '已发布 · v4'], ['信息技术服务清单', '技术服务', '已发布 · v2'], ['保密协议审查清单', '保密协议', '草稿']];
        const categories = [['采购合同', 'CG-01', '2 份清单'], ['技术服务', 'IT-02', '1 份清单'], ['保密协议', 'NDA-03', '1 份清单']];
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const B = (label, fn, cls = '') => `<button class="btn ${cls}" onclick="${fn}">${label}</button>`;
        const P = (name, cls = '') => `<span class="pill ${cls}">${esc(name)}</span>`;
        const header = (title, desc, actions = '') => `<div class="head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
        function toast(msg) { let e = document.getElementById('toast'); e.textContent = msg; e.classList.remove('hide'); clearTimeout(window.tt); window.tt = setTimeout(() => e.classList.add('hide'), 3000) }
        function nav(page) { state.page = page; history.replaceState(null, '', '#' + page); render(); window.scrollTo({ top: 0, behavior: 'smooth' }) }
        function render() { document.getElementById('nav').innerHTML = menus.map(([key, name, icon]) => `<button class="${state.page === key ? 'active' : ''}" onclick="nav('${key}')"><i>${icon}</i>${name}</button>`).join(''); document.getElementById('crumb').textContent = menus.find(x => x[0] === state.page)?.[1] || '工作台'; document.getElementById('view').innerHTML = ({ start: renderStart, workbench: renderWorkbench, records: renderRecords, validations: renderValidations, drafts: renderDrafts, templates: renderTemplates, checklists: renderChecklists, categories: renderCategories })[state.page](); }
        function set(k, v) { state[k] = v; render() }

        function openModal(type) {
            let title = '', body = ''; if (type === 'model') { title = '模型配置'; body = '<p class="muted">模型密钥仅在当前浏览器演示，不写入原型文件。</p><label class="field">服务类型<select><option>OpenAI 兼容接口</option><option>DeepSeek</option></select></label><label class="field">模型名称<input placeholder="例如：deepseek-chat"></label><label class="field">API 地址<input placeholder="https://..."></label><label class="field">密钥<input type="password" placeholder="输入 API Key"></label>' } else if (type === 'edit') { title = '编辑当前稿'; body = `<label class="field">合同正文<textarea style="min-height:260px">${esc(sample)}</textarea></label>` } else if (type === 'report') { title = '审查意见书预览'; body = `<p>云服务采购协议 · ${state.reviewStatus}</p><div class="status-line"><span>建议事项</span><b>${state.issues.length} 项</b></div><div class="status-line"><span>待处理</span><b>${state.issues.filter(x => x.status === '待处理').length} 项</b></div><p class="muted">包含背景、要求核验、问题证据、处理状态与导出范围。</p>` } else if (type === 'validation') { title = '模板核验报告'; body = '<div class="status-line"><span>固定条款</span><b>需人工确认</b></div><div class="status-line"><span>必填字段</span><b>通过</b></div><div class="status-line"><span>金额范围</span><b>无法确定</b></div><p class="notice">示例结论仅供展示，不能替代实际规则核验。</p>' } else if (type === 'policy') { title = '制度资料与审查要求'; body = '<label class="field">制度内容<textarea placeholder="粘贴制度内容，或记录具体审查要求"></textarea></label><label class="field">要求性质<select><option>硬性要求</option><option>优先偏好</option></select></label><p class="notice">实际系统支持文件提取、逐项确认与版本快照。</p>' } else if (type === 'rerun') { title = '重新审查'; body = '<p>可根据新的关注点重新执行审查。已有处理记录保留，建议需重新核对。</p><label class="field">补充要求<textarea placeholder="补充本次审查重点…"></textarea></label>' } else if (type === 'rewrite') { title = '调整建议'; body = `<label class="field">修改后的建议条款<textarea>${esc(state.issues[state.selectedIssue].next)}</textarea></label>` } else if (type === 'draftlist') { title = '起草记录'; body = '<div class="list"><button class="list-item" onclick="closeModal();toast(\'已打开示例草稿\')">云服务采购协议 · 最近编辑 →</button></div>' } else if (type === 'rules') { title = '模板规则配置'; body = '<p>DOCX 模板规则：选择原文区域、配置必填/长度/整数/日期/枚举规则、试算后发布版本。</p><div class="status-line"><span>甲方名称</span><b>必填</b></div><div class="status-line"><span>合同金额</span><b>整数范围</b></div><div class="status-line"><span>签署日期</span><b>日期</b></div>' } else if (type === 'groups') { title = '模板分组'; body = '<div class="status-line"><span>采购合同</span><b>2 份模板</b></div><div class="status-line"><span>保密协议</span><b>1 份模板</b></div>' } else { title = ({ template: '合同模板', checklist: '审查清单', category: '业务分类' })[type.replace('detail', '')] || '详情'; body = `<label class="field">名称<input placeholder="输入${title}名称"></label><label class="field">说明<textarea placeholder="补充说明…"></textarea>${type.includes('template') ? '<label class="field">分组<select><option>采购合同</option><option>保密协议</option></select></label>' : ''}` }
            document.getElementById('modal-body').innerHTML = `<div class="section-title"><h2>${title}</h2><button class="btn" onclick="closeModal()">关闭</button></div>${body}<div class="section row" style="justify-content:flex-end">${B('取消', "closeModal()")}${B(type.includes('detail') ? '完成' : '保存', "closeModal();toast('已记录原型操作')", 'primary')}</div>`; document.getElementById('modal').classList.remove('hide')
        }
        function closeModal() { document.getElementById('modal').classList.add('hide') } function downloadText(name) { let blob = new Blob([name + '\n\n' + (state.draftText || sample) + '\n\n此文件是交互原型的示例内容，并非正式 Word 或审核报告。'], { type: 'text/plain;charset=utf-8' }); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '-原型示例.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('已下载示例文本') }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() }); state.page = location.hash.slice(1) || 'start'; if (![...menus.map(x => x[0]), 'workbench'].includes(state.page)) state.page = 'start'; render();
    </script>
    <link rel="stylesheet" href="detail.css">
    <script src="detail.js"></script>
</body>
