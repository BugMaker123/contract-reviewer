<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-src blob:; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合同原件预览</title><style>body{margin:0;background:#f3f6fa;color:#334155;font:14px system-ui}body > header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dbe3ef;padding:10px 16px;display:flex;align-items:center;gap:12px}button,select,a{color:#2563eb;font:inherit}button,select{border:1px solid #dbe3ef;background:#fff;border-radius:6px;padding:4px 8px}#status{padding:24px;text-align:center}#viewport{overflow:auto}#pages{transform-origin:top left;width:max-content;min-width:100%}.docx-wrapper{background:transparent!important;padding:24px!important}section.docx{box-shadow:0 2px 8px #cbd5e1!important;margin-bottom:24px!important}.lexis-located{outline:2px solid #2563eb;outline-offset:3px;background:rgba(254,240,138,.45);scroll-margin-top:90px}#locate-status{color:#64748b;font-size:12px}iframe{width:100%;height:calc(100vh - 55px);border:0}</style></head><body><header><span id="name">原件预览</span><select id="zoom" aria-label="预览缩放"><option value="fit">适应宽度</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option></select><a id="download" download>下载当前文档</a><button id="save-edit" hidden>保存正文</button><button id="cancel-edit" hidden>取消编辑</button><span id="locate-status" role="status"></span></header><div id="status" role="status">正在加载原件…</div><div id="viewport"><div id="pages"></div></div><script src="/static/vendor/jszip.min.js"></script><script src="/static/vendor/docx-preview.min.js"></script><script>
(async()=>{
 const id=new URLSearchParams(location.search).get('source');const status=document.querySelector('#status'),pages=document.querySelector('#pages'),zoom=document.querySelector('#zoom');
 const resize=()=>{const page=pages.querySelector('section.docx');if(!page)return;const scale=zoom.value==='fit'?Math.min(1,(innerWidth-48)/page.offsetWidth):Number(zoom.value);pages.style.zoom=scale;};
 let info, editable=[], anchors=[];
 const hint=document.querySelector('#locate-status'),save=document.querySelector('#save-edit'),cancel=document.querySelector('#cancel-edit');
 const finish=()=>{editable.forEach(item=>{item.element.contentEditable='false';});save.hidden=cancel.hidden=true;};
 cancel.onclick=()=>{editable.forEach(item=>{item.element.innerHTML=item.originalHTML;});finish();hint.textContent='已取消编辑';};
 save.onclick=()=>{const lines=info.text.split('\n');editable.forEach(item=>{lines[item.index]=item.element.innerText.replace(/\r/g,'');});save.disabled=true;parent.postMessage({type:'lexis-save-document',text:lines.join('\n')},location.origin);};
 const normalize=text=>(text||'').replace(/\s+/g,'');
 window.addEventListener('message',event=>{
   if(event.origin!==location.origin || event.source!==parent)return;
   if(event.data?.type==='lexis-locate-edit'){
     const item=anchors.find(item=>event.data.index>=item.index && event.data.index<item.end);
     const matches=[...pages.querySelectorAll('article p')].filter(p=>normalize(p.textContent)===normalize(event.data.text));
     const element=item?.element || (matches.length===1 ? matches[0] : null);
     if(element){
       pages.querySelectorAll('.lexis-located').forEach(el=>el.classList.remove('lexis-located'));
       element.classList.add('lexis-located');
       element.scrollIntoView({behavior:'instant',block:'center'});
       hint.textContent='已定位到刚修改的位置';
       setTimeout(()=>element.classList.remove('lexis-located'),5000);
     }else{scrollTo(0,event.data.scroll||0);hint.textContent='已恢复保存前的阅读位置';}
     return;
   }
   if(event.data?.type==='lexis-save-error'){save.disabled=false;hint.textContent=event.data.message;return;}
   if(event.data?.type==='lexis-edit'){
     if(info?.extension!=='.docx'){hint.textContent='保留排版编辑仅支持 Word DOCX；PDF 请先转换为 Word';return;}
     if(!editable.length){hint.textContent='该文档段落无法安全映射，请在 Word 中编辑后重新上传';return;}
     editable.forEach(item=>{item.originalHTML=item.element.innerHTML;item.element.contentEditable='plaintext-only';});
     save.hidden=cancel.hidden=false;hint.textContent='直接点击正文修改，完成后保存；暂不支持增删段落';editable[0].element.focus();return;
   }
   if(event.data?.type!=='lexis-locate')return;
   const target=normalize(event.data.text);
   pages.querySelectorAll('.lexis-located').forEach(el=>el.classList.remove('lexis-located'));
   if(!target){hint.textContent='该意见没有可定位的原文证据';return;}
   const paragraphs=[...pages.querySelectorAll('article p')];
   let matches=paragraphs.filter(p=>normalize(p.textContent).includes(target));
   if(!matches.length){
     matches=paragraphs.filter(p=>{const text=normalize(p.textContent);return text.length>=12 && target.includes(text);});
   }
   if(!matches.length){hint.textContent='未能在原件精确定位，可手动切换至审查文本';return;}
   // Only a unique single-paragraph match or a contiguous multi-paragraph passage is safe to anchor.
   if(matches.length>1 && (matches.some(p=>normalize(p.textContent).includes(target)) || matches.some((p,i)=>i && paragraphs.indexOf(p)!==paragraphs.indexOf(matches[i-1])+1))){hint.textContent='原文有多处匹配，请在审查文本中核对';return;}
   matches.forEach(p=>p.classList.add('lexis-located'));
   matches[0].scrollIntoView({behavior:'smooth',block:'center'});
   hint.textContent='已定位原文';
 });
 zoom.onchange=resize;window.addEventListener('resize',resize);
 try{
 if(!/^[a-f0-9]{32}$/.test(id||''))throw Error('原件标识无效');
 const response=await fetch('/api/sources/'+id+'?include_text=true');if(!response.ok)throw Error('原件记录不存在');info=await response.json();document.querySelector('#name').textContent=info.name;
 const url='/api/sources/'+id+'/file';const link=document.querySelector('#download');link.href=url;link.download=info.name;
 const file=await fetch(url);if(!file.ok)throw Error('原件文件缺失，请重新上传');const blob=await file.blob();
 if(info.extension==='.docx'){
 await docx.renderAsync(blob,pages,null,{ignoreLastRenderedPageBreak:false,renderHeaders:true,renderFooters:true,renderAltChunks:false,useBase64URL:true});
 // Original document links must never navigate or load resources outside the internal preview.
 pages.querySelectorAll('a').forEach(a=>{a.removeAttribute('href');a.removeAttribute('target');});
 const elements=[...pages.querySelectorAll('article p')];let cursor=0;
 let index=0;
 for(const text of info.paragraphs || info.text.split('\n')){
   const end=index+text.split('\n').length;
   if(text.trim()){
     const found=elements.findIndex((p,i)=>i>=cursor && normalize(p.textContent)===normalize(text));
     if(found>=0){
       const element=elements[found];
       anchors.push({index,end,element});
       // Soft breaks and tabs need a richer editor; they must not invalidate other anchors.
       if(!/[\n\t]/.test(text))editable.push({index,element,original:element.innerText});
       cursor=found+1;
     }
   }
   index=end;
 }
 resize();
 }else if(info.extension==='.pdf'){zoom.hidden=true;const frame=document.createElement('iframe');frame.title='PDF 原件';frame.src=URL.createObjectURL(blob);pages.append(frame);}
 else{zoom.hidden=true;status.textContent='TXT 没有 Word 排版，请使用审查文本视图，或下载原件。';return;}
 status.hidden=true;
 await document.fonts.ready;
 resize();
 requestAnimationFrame(()=>requestAnimationFrame(()=>parent.postMessage({type:'lexis-document-ready',source:id},location.origin)));
 }catch(error){status.textContent='预览失败：'+error.message+'。可切换至审查文本继续核对。';}
})();</script></body></html>
