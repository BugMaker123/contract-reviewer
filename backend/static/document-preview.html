<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-src blob:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>合同原件预览</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #334155;
      font: 13px system-ui
    }

    [hidden] {
      display: none !important
    }

    body>header {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 44px;
      background: #fff;
      border-bottom: 1px solid #edf0f5;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .pane-identity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      white-space: nowrap
    }

    #pane-label {
      font-size: 12px;
      font-weight: 600;
      color: #334155
    }

    #pane-badge {
      font-size: 10px;
      font-weight: 500;
      color: #64748b;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 2px 5px
    }

    body[data-pane="revised"] #pane-badge {
      color: #397861;
      background: #eef7f2
    }

    #name {
      display: none
    }

    .pane-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto
    }

    button,
    a {
      font: inherit;
      color: #64748b
    }

    button {
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 5px;
      padding: 4px 8px
    }

    button:hover,
    a:hover {
      color: #1d4ed8;
      background: #f8fafc
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px
    }

    #download {
      display: none !important;
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      font-size: 11px;
      padding: 5px;
      border-radius: 4px
    }

    #download svg {
      width: 13px;
      height: 13px
    }

    #save-edit {
      color: #fff;
      background: #2563eb;
      border-color: #2563eb;
      font-size: 11px
    }

    #cancel-edit {
      font-size: 11px
    }

    #zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      border-radius: 6px;
      background: #f5f7fa;
      padding: 2px;
      color: #64748b
    }

    #zoom-controls button {
      border: 0;
      background: transparent;
      padding: 2px 6px;
      font-size: 11px;
      line-height: 18px;
      border-radius: 4px
    }

    #zoom-controls button:hover {
      background: #e8edf5
    }

    #zoom-fit[aria-pressed="true"] {
      background: #fff;
      color: #475569;
      box-shadow: 0 1px 2px #0f172a0d
    }

    #zoom-percent {
      font-size: 10px;
      min-width: 32px;
      text-align: center;
      font-variant-numeric: tabular-nums
    }

    .zoom-divider {
      width: 1px;
      height: 12px;
      background: #e2e8f0;
      margin: 0 2px
    }

    #locate-status {
      color: #64748b;
      font-size: 11px;
      flex-basis: 100%;
      overflow-wrap: anywhere
    }

    #locate-status:empty {
      display: none
    }

    #locate-status.quiet {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap
    }

    #status {
      padding: 24px;
      text-align: center
    }

    #viewport {
      overflow: auto
    }

    #pages {
      transform-origin: top left;
      width: max-content;
      min-width: 100%
    }

    .docx-wrapper {
      background: transparent !important;
      padding: 16px !important
    }

    section.docx article p {
      overflow-wrap: anywhere
    }

    section.docx {
      box-shadow: 0 1px 5px #dbe1e9 !important;
      margin-bottom: 24px !important
    }

    #pages .lexis-located {
      outline: none;
      box-shadow: inset 3px 0 #ef4444 !important;
      background: transparent !important;
      border-radius: 3px;
      scroll-margin-top: 70px
    }

    iframe {
      width: 100%;
      height: calc(100vh - 44px);
      border: 0
    }

    @media(max-width:440px) {
      #pane-badge {
        display: none
      }

      body>header {
        gap: 4px;
        padding: 7px 8px
      }

      .pane-actions {
        gap: 4px
      }

      #zoom-controls button {
        padding: 2px 4px
      }
    }

    html.shared-original {
      scrollbar-width: none
    }

    html.shared-original::-webkit-scrollbar {
      display: none
    }

    mark.lexis-diff-token[data-side="original"] {
      background: rgba(253, 230, 138, .65) !important;
      box-shadow: inset 3px 0 #e9a526;
      border-radius: 2px
    }

    mark.lexis-diff-token[data-side="revised"] {
      background: rgba(254, 202, 202, .65) !important;
      box-shadow: inset 3px 0 #ef4444;
      border-radius: 2px
    }

    #pages .lexis-review-risk {
      background: transparent !important;
      box-shadow: inset 3px 0 #ef4444 !important;
      border-radius: 3px;
      scroll-margin-top: 70px
    }

    #zoom-controls {
      position: relative;
      background: transparent;
      padding: 0
    }

    #zoom-percent {
      min-width: 72px;
      padding: 4px 10px !important;
      text-align: left;
      font-size: 11px !important;
      border: 1px solid #e2e8f0 !important;
      background: #fff !important;
      color: #475569
    }

    #zoom-percent::after {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      margin: 0 0 3px 10px
    }

    #zoom-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 128px;
      padding: 4px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 8px 24px #0f172a18;
      z-index: 10
    }

    #zoom-menu button {
      display: block;
      width: 100%;
      padding: 6px 10px !important;
      text-align: left
    }

    #zoom-menu button[aria-checked="true"] {
      background: #eff6ff;
      color: #2563eb;
      font-weight: 600
    }
    .review-document #pages ins { color: #c32b38 !important; text-decoration: underline !important; text-decoration-thickness: 1px; text-underline-offset: 3px; background: #fff5f5; }
    .review-document #pages del { color: #c32b38 !important; text-decoration: line-through !important; background: #fff1f2; }
    .review-document #pages ins *, .review-document #pages del * { color: inherit !important; }
    .review-document #pages .review-clause { cursor: pointer; }
    .review-document, .review-document #pages { background: #eef1f5; }
    body.review-document { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    .review-document #viewport { flex: 1; min-height: 0; overflow: auto; }
    .review-document > header, .review-document #hint { display: none !important; }
    .review-document .docx-wrapper { padding: 16px 16px 32px !important; }
    .review-document section.docx { box-shadow: 0 2px 12px #33415514 !important; }
    .review-document #pages .review-active { background: #f0efff; }
    .review-document #pages ins { color: #245bdb !important; background: #f0f5ff; }
    .review-document #pages .review-active ins { font-weight: 600; }
    .review-document #pages del { color: #9b5660 !important; background: #fff5f5; }
    .review-selection-box { position: fixed; pointer-events: none; border: 2px solid #7566ff; border-radius: 4px; z-index: 5; }
    #review-callout { position: fixed; z-index: 6; border: 1px solid #ef4444; border-radius: 6px; background: white; color: #dc2626; padding: 8px 10px; font: 600 12px system-ui; box-shadow: 0 3px 10px #0f172a12; cursor: pointer; }
    #review-callout::before { content: ''; position: absolute; width: 14px; height: 1px; background: #ef4444; top: 50%; left: -15px; }
    @media print { .review-selection-box, #review-callout { display: none; } .review-document #pages .review-active { background: transparent; } }


    .review-document #pages .review-applied,
    .review-document #pages .review-applied.review-active { background: #eaf8ef; }
    .review-document #pages .review-applied ins,
    .review-document #pages .review-applied span { color: #167343 !important; background: transparent; }
    .review-document #pages .review-applied { color: #167343 !important; }
    .review-selection-box.is-applied { border-color: #22a663; }
    #review-callout.is-applied { border-color: #22a663; color: #15803d; background: #f0fdf4; }
    #review-callout.is-applied::before { background: #22a663; }
    .review-document #pages .review-rejected { background: #f1f5f9; box-shadow: inset 3px 0 #94a3b8; }
    .review-document #pages .review-rejected.review-active { background: #e8edf4; }
    .review-selection-box.is-rejected { border-color: #94a3b8; border-style: dashed; }
    #review-callout.is-rejected { border-color: #94a3b8; color: #475569; background: #f8fafc; }
    #review-callout.is-rejected::before { background: #94a3b8; }
    .review-document #pages .review-missing-field,
    .review-document #pages .review-missing-field.review-active,
    .review-document #pages .review-missing-field.review-applied,
    .review-document #pages .review-missing-field.review-rejected { background: #fff4e5; box-shadow: inset 3px 0 #f59e0b; }
    .review-document #pages .review-missing-field::after { content: '字段缺失 · 待补充'; display: inline-block; margin-left: 12px; padding: 1px 7px; border: 1px solid #fbbf24; border-radius: 4px; background: #fffbeb; color: #b45309; font: 12px/1.6 system-ui; text-indent: 0; vertical-align: middle; }
    .review-document #pages .review-missing-field.is-critical { box-shadow: inset 3px 0 #ef4444; background: #fff1f2; }
    @media print { .review-document #pages .review-missing-field::after { display: none; } }

  </style>
</head>

<body>
  <header>
    <div class="pane-identity"><span id="pane-label">原始文档</span><span id="pane-badge" hidden></span><span
        id="name"></span></div>
    <div class="pane-actions">
      <div id="zoom-controls" role="group" aria-label="文档缩放" hidden><button id="zoom-percent" aria-label="选择文档缩放比例"
          aria-haspopup="true" aria-expanded="false">80%</button>
        <div id="zoom-menu" role="menu" aria-label="缩放比例" hidden><button role="menuitemradio"
            data-zoom="fit">适应宽度</button><button role="menuitemradio" data-zoom="0.5">50%</button><button
            role="menuitemradio" data-zoom="0.8">80%</button><button role="menuitemradio"
            data-zoom="1">100%</button><button role="menuitemradio" data-zoom="1.25">125%</button><button
            role="menuitemradio" data-zoom="1.5">150%</button><button role="menuitemradio" data-zoom="2">200%</button>
        </div>
      </div><a id="download" download aria-label="下载文档" title="下载此文档"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" />
        </svg>下载</a><button id="save-edit" hidden>保存正文</button><button id="cancel-edit" hidden>取消编辑</button>
    </div><span id="locate-status" role="status"></span>
  </header>
  <div id="status" role="status">正在加载原件…</div>
  <div id="viewport">
    <div id="pages"></div>
  </div>
  <script src="/static/vendor/jszip.min.js"></script>
  <script src="/static/vendor/docx-preview.min.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search), tracking = params.get('review') === '1', display = params.get('display') || 'markup', id = params.get('source'), run = params.get('run'), scope = params.get('scope') || 'current', readOnly = params.get('readonly') === '1'; const status = document.querySelector('#status'), pages = document.querySelector('#pages'), zoom = { value: 'fit' }, zoomControls = document.querySelector('#zoom-controls');
      const resize = () => {
        const sheets = [...pages.querySelectorAll('section.docx')]; if (!sheets.length) return;
        const width = Math.max(...sheets.map(page => Math.max(page.offsetWidth, page.scrollWidth)));
        const available = document.documentElement.clientWidth;
        const fit = Math.min(1, Math.max(.1, (available - 32) / (width + 32)));
        const scale = zoom.value === 'fit' ? fit : Number(zoom.value);
        pages.style.zoom = scale;
        document.querySelector('#zoom-percent').textContent = zoom.value === 'fit' ? '适应宽度' : Math.round(scale * 100) + '%';
        document.querySelectorAll('[data-zoom]').forEach(button => button.setAttribute('aria-checked', String(button.dataset.zoom === zoom.value)));
      };
      const pane = params.get('pane') === 'revised' ? 'revised' : 'original';
      document.body.dataset.pane = pane;
      if (params.get('shared') === '1') document.documentElement.classList.add('shared-original');
      const label = document.querySelector('#pane-label'), badge = document.querySelector('#pane-badge');
      label.textContent = pane === 'revised' ? '修订文档' : '原始文档';
      if (readOnly) { badge.hidden = false; badge.textContent = '只读'; }
      if (pane === 'revised') { badge.hidden = false; badge.textContent = params.get('edited') === '1' ? '编辑稿' : '全部建议'; badge.title = params.get('edited') === '1' ? '当前人工编辑稿' : '全部修改建议，未自动采纳'; }
      if (tracking) { label.textContent = '合同修订'; badge.hidden = false; badge.textContent = display === 'markup' ? '所有标记' : display === 'current' ? '仅已接受' : '原始稿'; }
      let info, editable = [], anchors = [], documentRendered = false, pendingMarks = null, followPausedUntil = 0;
      const reviewElements = new Map();
      let selectedReviewId = null, selectionFrame = 0;
      const selectionBox = document.createElement('div'), selectionCallout = document.createElement('button');
      selectionBox.className = 'review-selection-box';
      selectionBox.id = 'review-selection'; selectionCallout.id = 'review-callout';
      selectionCallout.textContent = '⚠ 建议修订';
      selectionBox.hidden = selectionCallout.hidden = true;
      document.body.append(selectionBox, selectionCallout);
      selectionCallout.onclick = () => parent.postMessage({type: 'lexis-review-select', run, issue: selectedReviewId}, location.origin);
      const drawSelection = () => {
        selectionFrame = 0;
        document.querySelectorAll('.review-selection-extra').forEach(el => el.remove());
        const state = info?.review_items?.find(item => item.id === selectedReviewId)?.state;
        const applied = state === 'applied', rejected = state === 'rejected';
        selectionBox.classList.toggle('is-applied', applied);
        selectionCallout.classList.toggle('is-applied', applied);
        selectionBox.classList.toggle('is-rejected', rejected);
        selectionCallout.classList.toggle('is-rejected', rejected);
        selectionCallout.textContent = applied ? '✓ 已采纳' : rejected ? '已拒绝 · 保留原文' : '⚠ 建议修订';
        const viewport = document.querySelector('#viewport').getBoundingClientRect();
        const groups = new Map();
        for (const el of reviewElements.get(selectedReviewId) || []) {
          if (!normalize(el.textContent)) continue;
          const rect = el.getBoundingClientRect();
          if (rect.bottom <= viewport.top || rect.top >= viewport.bottom) continue;
          const page = el.closest('section.docx') || el.closest('article');
          if (!groups.has(page)) groups.set(page, []);
          groups.get(page).push(rect);
        }
        const bounds = [...groups.values()].map(rects => ({
          left: Math.min(...rects.map(r => r.left)) - 6,
          right: Math.max(...rects.map(r => r.right)) + 6,
          top: Math.max(viewport.top, Math.min(...rects.map(r => r.top)) - 4),
          bottom: Math.min(viewport.bottom, Math.max(...rects.map(r => r.bottom)) + 4),
        }));
        selectionBox.hidden = selectionCallout.hidden = !bounds.length;
        if (!bounds.length) return;
        // Separate page fragments: never draw through page margins or page gaps.
        bounds.forEach((rect, index) => {
          const box = index === 0 ? selectionBox : selectionBox.cloneNode();
          if (index) { box.removeAttribute('id'); box.classList.add('review-selection-extra'); document.body.append(box); }
          const {left, right, top, bottom} = rect;
          Object.assign(box.style, {left:left+'px', top:top+'px', width:(right-left)+'px', height:(bottom-top)+'px'});
        });
        const {left, right, top, bottom} = bounds[0];
        const calloutLeft = right + 18;
        // Keep the one callout outside the text; suppress it when the gutter cannot fit it.
        selectionCallout.hidden = calloutLeft + 100 > document.documentElement.clientWidth - 10 || bottom-top < 24;
        Object.assign(selectionCallout.style, {left: calloutLeft+'px', top: Math.max(top, (top+bottom)/2-18)+'px'});
      };
      const scheduleSelection = () => { if (!selectionFrame) selectionFrame = requestAnimationFrame(drawSelection); };
      document.querySelector('#viewport').addEventListener('scroll', scheduleSelection, {passive: true});
      window.addEventListener('resize', scheduleSelection);
      new ResizeObserver(scheduleSelection).observe(pages);

      const focusReview = (issueId, scroll = true) => {
        pages.querySelectorAll('.review-active').forEach(element => element.classList.remove('review-active'));
        selectedReviewId = issueId;
        const targets = reviewElements.get(issueId) || [];
        targets.forEach(element => element.classList.add('review-active'));
        scheduleSelection();
        if (scroll) followPausedUntil = Date.now() + 1000;
        if (scroll) targets[0]?.scrollIntoView({behavior: 'smooth', block: 'center'});
      };
      let reviewListenersAttached = false;
      const reviewOrder = () => [...reviewElements].filter(([, els]) => els.length).sort((a, b) => {
        if (a[1][0] === b[1][0]) return 0;
        return a[1][0].compareDocumentPosition(b[1][0]) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      }).map(([id]) => id);
      const annotateReview = () => {
        reviewElements.clear();
        pages.querySelectorAll('.review-clause').forEach(el => {
          el.classList.remove('review-clause', 'review-active', 'review-pending', 'review-applied', 'review-rejected');
          delete el.dataset.reviewIssue;
          el.removeAttribute('title'); el.removeAttribute('tabindex');
        });
        pages.querySelectorAll('.review-missing-field').forEach(el => {el.classList.remove('review-missing-field', 'is-critical'); delete el.dataset.missingFields;});
        const elements = [...pages.querySelectorAll('article p')];
        const snapshots = elements.map(element => {
          const old = element.cloneNode(true), current = element.cloneNode(true);
          old.querySelectorAll('ins').forEach(node => node.remove());
          current.querySelectorAll('del').forEach(node => node.remove());
          return {element, before: normalize(old.textContent), after: normalize(current.textContent)};
        }).filter(item => item.before || item.after);
        for (const issue of info.review_items || []) {
          const old = normalize(issue.redline?.original_text || issue.evidence || '');
          const after = normalize(issue.redline?.suggested_text || '');
          // Locate both sides independently: a replacement may retain the full
          // original and append paragraphs, which still belong to this issue.
          const matched = new Set();
          for (const [field, target] of [['before', old], ['after', after]]) {
            if (!target) continue;
            const candidates = snapshots.filter(item => item[field]);
            let sideHits = candidates.filter(item => item[field] === target);
            if (!sideHits.length) {
              for (let start = 0; start < candidates.length && !sideHits.length; start++) {
                let joined = '';
                for (let end = start; end < candidates.length; end++) {
                  joined += candidates[end][field];
                  if (!target.startsWith(joined)) break;
                  if (joined === target) { sideHits = candidates.slice(start, end + 1); break; }
                }
              }
            }
            sideHits.forEach(item => matched.add(item));
          }
          let hits = snapshots.filter(item => matched.has(item));
          if (!hits.length) {
            const containing = snapshots.filter(item => [item.before, item.after].some(text =>
              (old.length >= 12 && text.includes(old)) || (after.length >= 12 && text.includes(after))));
            if (containing.length === 1) hits = containing;
          }
          reviewElements.set(issue.id, hits.map(item => item.element));
          for (const {element} of hits) {
            element.classList.add('review-clause');
            if (issue.state === 'applied') element.classList.add('review-applied');
            if (issue.state === 'rejected') element.classList.add('review-rejected');
            if (issue.state === 'pending' || issue.state === 'needs_review') element.classList.add('review-pending');
            element.dataset.reviewIssue = element.dataset.reviewIssue || issue.id;
            element.title = issue.issue_title + ' · ' + (issue.state === 'applied' ? '已采纳' : issue.state === 'rejected' ? '已拒绝' : '待采纳');
            element.tabIndex = 0;
          }
        }
        // Missing information is a finding even when no replacement text exists.
        // Detect empty labeled fields only when an actual review finding names them;
        // annotations never become contract text or alter Word contents.
        const fields = [
          ['法定代表人', '法定代表人|法定代表人（签字）|法定代表人或授权代表'],
          ['地址', '地址|住所|联系地址|注册地址'],
          ['银行账号', '银行账号|银行帐号|账号|帐号|收款账号'],
          ['开户行', '开户行|开户银行'], ['户名', '户名|账户名称|收款人'],
          ['金额', '合同金额|合同总价|总金额|价款'],
          ['税率', '税率|增值税税率'], ['协议编号', '协议编号|合同编号'],
          ['联系方式', '联系电话|联系方式|联系人|电话'],
        ];
        for (const item of snapshots) {
          const raw = item.element.cloneNode(true);
          raw.querySelectorAll('ins').forEach(el => el.remove());
          const missing = fields.filter(([, aliases]) => new RegExp('(?:^|\\n)[ \\t]*(' + aliases + ')[ \\t]*[：:][ \\t_＿—.．·]*(?=\\n|$)').test(raw.textContent));
          if (!missing.length) continue;
          const findings = (info.review_items || []).filter(issue => {
            const description = [issue.issue_title, issue.risk_analysis].filter(Boolean).join(' ');
            return /空白|未填写|未填|缺失|未提供|未载明/.test(description) && missing.some(([name, aliases]) => new RegExp(aliases).test(description));
          });
          if (!findings.length) continue;
          const issue = findings.find(issue => (reviewElements.get(issue.id) || []).includes(item.element)) || findings[0];
          const el = item.element;
          el.classList.add('review-missing-field', 'review-clause');
          if (findings.some(issue => issue.severity === 'critical')) el.classList.add('is-critical');
